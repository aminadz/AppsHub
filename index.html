<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر التطبيقات | App Store</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Tajawal:wght@300;400;500;700;900&display=swap"
        rel="stylesheet">
    <!-- Ionicons -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>

<body>

    <!-- Header -->
    <header>
        <div class="container header-content">
            <div class="logo">
                <ion-icon name="logo-google-playstore"></ion-icon>
                <span>AppsHub</span>
            </div>
            <div class="search-bar">
                <ion-icon name="search-outline"></ion-icon>
                <input type="text" id="searchInput" data-i18n-placeholder="searchPlaceholder"
                    placeholder="Search apps and games...">
            </div>
            <button class="btn-ghost" id="langSwitchBtn">
                <ion-icon name="globe-outline"></ion-icon>
                <span>AR</span>
            </button>
            <button class="btn-secondary" id="openLoginModalBtn">
                <ion-icon name="log-in-outline"></ion-icon>
                <span data-i18n="adminLogin">Admin Login</span>
            </button>
            <button class="btn-primary" id="openUploadModalBtn" style="display: none;"> <!-- Hidden by default -->
                <ion-icon name="cloud-upload-outline"></ion-icon>
                <span data-i18n="uploadApp">Upload App</span>
            </button>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="container hero-content">
            <div class="hero-text">
                <h1 data-i18n="heroTitle">Discover Your Digital World</h1>
                <p data-i18n="heroSubtitle">Best apps and games in your hands. Download, enjoy, and share your
                    creativity.</p>
                <button class="btn-explore" data-i18n="exploreBtn">Explore Now</button>
            </div>
            <div class="hero-image">
                <div class="floating-icon icon-1"><ion-icon name="game-controller"></ion-icon></div>
                <div class="floating-icon icon-2"><ion-icon name="musical-notes"></ion-icon></div>
                <div class="floating-icon icon-3"><ion-icon name="videocam"></ion-icon></div>
            </div>
        </div>
    </section>

    <!-- Categories (Optional) -->
    <section class="categories container">
        <button class="chip active" data-i18n="catAll">All</button>
        <button class="chip" data-i18n="catGames">Games</button>
        <button class="chip" data-i18n="catSocial">Social</button>
        <button class="chip" data-i18n="catPoductivity">Productivity</button>
        <button class="chip" data-i18n="catEducation">Education</button>
    </section>

    <!-- Apps Grid -->
    <main class="container">
        <h2 class="section-title" data-i18n="popularSection">Most Popular</h2>
        <div class="apps-grid" id="appsGrid">
            <!-- Apps will be injected here by JS -->
        </div>
    </main>

    <!-- Upload Modal -->
    <div class="modal-overlay" id="uploadModal">
        <div class="modal">
            <div class="modal-header">
                <h3 data-i18n="uploadModalTitle">Upload New App</h3>
                <button class="close-modal" id="closeUploadModalBtn"><ion-icon name="close-outline"></ion-icon></button>
            </div>
            <div class="modal-body">
                <form id="uploadForm">
                    <div class="form-group">
                        <label data-i18n="appNameLabel">App Name</label>
                        <input type="text" id="appName" required placeholder="Ex: WhatsApp Gold">
                    </div>
                    <div class="form-group">
                        <label data-i18n="devNameLabel">Developer</label>
                        <input type="text" id="appDeveloper" required placeholder="Your Name or Team">
                    </div>
                    <div class="form-group">
                        <label data-i18n="descLabel">Description</label>
                        <textarea id="appDesc" rows="3" required placeholder="Short description..."></textarea>
                    </div>
                    <div class="form-group">
                        <label data-i18n="iconLabel">App Icon</label>
                        <input type="file" id="appIcon" accept="image/*" required>
                        <div id="iconProgress" class="upload-progress"></div>
                    </div>
                    <div class="form-group">
                        <label data-i18n="fileLabel">App File (APK)</label>
                        <input type="file" id="appFile" accept=".apk" required>
                        <div id="fileProgress" class="upload-progress"></div>
                    </div>
                    <button type="submit" id="publishBtn" class="btn-primary full-width" data-i18n="publishBtn"
                        disabled>Publish App</button>
                </form>
            </div>
        </div>
    </div>

    <!-- App Details Modal -->
    <div class="modal-overlay" id="detailsModal">
        <div class="modal details-modal-content">
            <button class="close-modal-absolute" id="closeDetailsModalBtn"><ion-icon
                    name="close-outline"></ion-icon></button>
            <div class="details-header">
                <img src="" alt="App Icon" id="detailIcon" class="detail-icon">
                <div class="detail-info">
                    <h2 id="detailName">App Name</h2>
                    <p id="detailDeveloper" class="detail-dev">Developer</p>
                    <div class="detail-stat">
                        <span><ion-icon name="star"></ion-icon> 4.8</span>
                        <span><ion-icon name="download"></ion-icon> 1M+</span>
                    </div>
                </div>
            </div>
            <div class="details-body">
                <p id="detailDesc">Description here...</p>
                <div class="detail-actions">
                    <button class="btn-ghost full-width" id="shareBtn"
                        style="margin-bottom: 10px; border: 1px solid var(--border-color);" data-i18n="shareBtn">
                        <ion-icon name="share-social-outline"></ion-icon> <span id="shareText">Share App</span>
                    </button>
                    <button class="btn-primary full-width" id="downloadBtn" data-i18n="downloadBtn">Download</button>
                    <button class="btn-danger full-width" id="deleteBtn" style="display: none; margin-top: 10px;"
                        data-i18n="deleteBtn">Delete App</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Login Modal -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal">
            <div class="modal-header">
                <h3 data-i18n="loginModalTitle">Admin Login</h3>
                <button class="close-modal" id="closeLoginModalBtn"><ion-icon name="close-outline"></ion-icon></button>
            </div>
            <div class="modal-body">
                <form id="loginForm">
                    <div class="form-group">
                        <label data-i18n="emailLabel">Email</label>
                        <input type="email" id="loginEmail" required>
                    </div>
                    <div class="form-group">
                        <label data-i18n="passwordLabel">Password</label>
                        <input type="password" id="loginPassword" required>
                    </div>
                    <button type="submit" class="btn-primary full-width" data-i18n="loginBtn">Login</button>
                </form>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>

</html>
